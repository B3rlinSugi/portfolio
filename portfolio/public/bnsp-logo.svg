<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Shield background -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D2137;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5C518;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4A017;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="innerGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer shield shape -->
  <path d="M100 10 L175 45 L175 110 Q175 160 100 190 Q25 160 25 110 L25 45 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
  
  <!-- Inner shield border -->
  <path d="M100 22 L165 52 L165 108 Q165 152 100 178 Q35 152 35 108 L35 52 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Gear/cog symbol -->
  <circle cx="100" cy="95" r="32" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="100" cy="95" r="22" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="100" cy="95" r="8" fill="url(#goldGrad)"/>
  
  <!-- Gear teeth -->
  <g stroke="url(#goldGrad)" stroke-width="3" fill="none">
    <line x1="100" y1="58" x2="100" y2="66"/>
    <line x1="100" y1="124" x2="100" y2="132"/>
    <line x1="63" y1="95" x2="71" y2="95"/>
    <line x1="129" y1="95" x2="137" y2="95"/>
    <line x1="74" y1="69" x2="80" y2="75"/>
    <line x1="120" y1="115" x2="126" y2="121"/>
    <line x1="126" y1="69" x2="120" y2="75"/>
    <line x1="80" y1="115" x2="74" y2="121"/>
  </g>
  
  <!-- Star at top -->
  <polygon points="100,30 103,38 112,38 105,43 108,52 100,47 92,52 95,43 88,38 97,38" fill="url(#goldGrad)"/>
  
  <!-- BNSP text -->
  <text x="100" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="url(#goldGrad)" letter-spacing="4">BNSP</text>
  
  <!-- Decorative lines -->
  <line x1="55" y1="140" x2="85" y2="140" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5"/>
  <line x1="115" y1="140" x2="145" y2="140" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5"/>
</svg>
